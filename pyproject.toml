[project]
name = "devfoundry"
version = "0.1.0"
description = "AI-native operating layer for software engineering work — orchestrator, agents, skills, and persistent memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - not yet licensed for reuse" }
authors = [
    { name = "Your Name" }
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "anthropic>=0.34",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
devfoundry = "devfoundry.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devfoundry"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
